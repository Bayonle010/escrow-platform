services:
  identity-service:
    image: escrow-platform/identity-service:0.1.0-SNAPSHOT
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    environment:
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
