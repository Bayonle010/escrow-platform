services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:19092
        --create
        --if-not-exists
        --topic payment.events.v1
        --partitions 3
        --replication-factor 1
        --config min.insync.replicas=1
        &&
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:19092
        --create
        --if-not-exists
        --topic ledger.events.v1
        --partitions 3
        --replication-factor 1
        --config min.insync.replicas=1
    restart: "no"

  identity-service:
    image: escrow-platform/identity-service:0.1.0-SNAPSHOT
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8081"
      IDENTITY_DB_HOST: postgres
      IDENTITY_DB_PORT: "5432"
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-identity_db}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity_local}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_local_password}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  escrow-service:
    image: escrow-platform/escrow-service:0.1.0-SNAPSHOT
    build:
      context: .
      dockerfile: services/escrow-service/Dockerfile
    depends_on:
      escrow-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8082"
      ESCROW_DB_HOST: escrow-postgres
      ESCROW_DB_PORT: "5432"
      ESCROW_DB_NAME: ${ESCROW_DB_NAME:-escrow_db}
      ESCROW_DB_USER: ${ESCROW_DB_USER:-escrow_local}
      ESCROW_DB_PASSWORD: ${ESCROW_DB_PASSWORD:-escrow_local_password}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  payment-service:
    image: escrow-platform/payment-service:0.1.0-SNAPSHOT
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    depends_on:
      payment-postgres:
        condition: service_healthy
      escrow-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: "8083"
      PAYMENT_DB_HOST: payment-postgres
      PAYMENT_DB_PORT: "5432"
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-payment_local}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_local_password}
      ESCROW_SERVICE_BASE_URL: http://escrow-service:8082
      SIMULATED_PROVIDER_CALLBACK_SECRET: ${SIMULATED_PROVIDER_CALLBACK_SECRET:-local-development-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  ledger-service:
    image: escrow-platform/ledger-service:0.1.0-SNAPSHOT
    build:
      context: .
      dockerfile: services/ledger-service/Dockerfile
    depends_on:
      ledger-postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: "8084"
      LEDGER_DB_HOST: ledger-postgres
      LEDGER_DB_PORT: "5432"
      LEDGER_DB_NAME: ${LEDGER_DB_NAME:-ledger_db}
      LEDGER_DB_USER: ${LEDGER_DB_USER:-ledger_local}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_local_password}
      LEDGER_INTERNAL_EVENT_SECRET: ${LEDGER_INTERNAL_EVENT_SECRET:-local-development-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:-identity_db}
      POSTGRES_USER: ${IDENTITY_DB_USER:-identity_local}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_local_password}
    ports:
      - "${IDENTITY_DB_PORT:-5432}:5432"
    volumes:
      - identity-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  escrow-postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${ESCROW_DB_NAME:-escrow_db}
      POSTGRES_USER: ${ESCROW_DB_USER:-escrow_local}
      POSTGRES_PASSWORD: ${ESCROW_DB_PASSWORD:-escrow_local_password}
    ports:
      - "${ESCROW_DB_PORT:-5433}:5432"
    volumes:
      - escrow-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  payment-postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment_db}
      POSTGRES_USER: ${PAYMENT_DB_USER:-payment_local}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_local_password}
    ports:
      - "${PAYMENT_DB_PORT:-5434}:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  ledger-postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${LEDGER_DB_NAME:-ledger_db}
      POSTGRES_USER: ${LEDGER_DB_USER:-ledger_local}
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_local_password}
    ports:
      - "${LEDGER_DB_PORT:-5435}:5432"
    volumes:
      - ledger-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

volumes:
  identity-postgres-data:
  escrow-postgres-data:
  payment-postgres-data:
  ledger-postgres-data:
