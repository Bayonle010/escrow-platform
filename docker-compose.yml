services:
  identity-service:
    image: escrow-platform/identity-service:0.1.0-SNAPSHOT
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8081"
      IDENTITY_DB_HOST: postgres
      IDENTITY_DB_PORT: "5432"
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-identity_db}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity_local}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_local_password}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  escrow-service:
    image: escrow-platform/escrow-service:0.1.0-SNAPSHOT
    build:
      context: .
      dockerfile: services/escrow-service/Dockerfile
    depends_on:
      escrow-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8082"
      ESCROW_DB_HOST: escrow-postgres
      ESCROW_DB_PORT: "5432"
      ESCROW_DB_NAME: ${ESCROW_DB_NAME:-escrow_db}
      ESCROW_DB_USER: ${ESCROW_DB_USER:-escrow_local}
      ESCROW_DB_PASSWORD: ${ESCROW_DB_PASSWORD:-escrow_local_password}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  payment-service:
    image: escrow-platform/payment-service:0.1.0-SNAPSHOT
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    depends_on:
      payment-postgres:
        condition: service_healthy
      escrow-service:
        condition: service_healthy
    environment:
      SERVER_PORT: "8083"
      PAYMENT_DB_HOST: payment-postgres
      PAYMENT_DB_PORT: "5432"
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-payment_local}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_local_password}
      ESCROW_SERVICE_BASE_URL: http://escrow-service:8082
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:-identity_db}
      POSTGRES_USER: ${IDENTITY_DB_USER:-identity_local}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_local_password}
    ports:
      - "${IDENTITY_DB_PORT:-5432}:5432"
    volumes:
      - identity-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  escrow-postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${ESCROW_DB_NAME:-escrow_db}
      POSTGRES_USER: ${ESCROW_DB_USER:-escrow_local}
      POSTGRES_PASSWORD: ${ESCROW_DB_PASSWORD:-escrow_local_password}
    ports:
      - "${ESCROW_DB_PORT:-5433}:5432"
    volumes:
      - escrow-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  payment-postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment_db}
      POSTGRES_USER: ${PAYMENT_DB_USER:-payment_local}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_local_password}
    ports:
      - "${PAYMENT_DB_PORT:-5434}:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

volumes:
  identity-postgres-data:
  escrow-postgres-data:
  payment-postgres-data:
