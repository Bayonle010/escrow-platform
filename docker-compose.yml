services:
  identity-service:
    image: escrow-platform/identity-service:0.1.0-SNAPSHOT
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8081"
      IDENTITY_DB_HOST: postgres
      IDENTITY_DB_PORT: "5432"
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-identity_db}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity_local}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_local_password}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:-identity_db}
      POSTGRES_USER: ${IDENTITY_DB_USER:-identity_local}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_local_password}
    ports:
      - "${IDENTITY_DB_PORT:-5432}:5432"
    volumes:
      - identity-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

volumes:
  identity-postgres-data:
