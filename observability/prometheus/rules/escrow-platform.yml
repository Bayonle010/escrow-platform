groups:
  - name: escrow-platform-availability
    rules:
      - alert: EscrowPlatformServiceDown
        expr: up{job=~"(identity|escrow|payment|ledger)-service"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is unavailable"
          description: "Prometheus has been unable to scrape {{ $labels.job }} for 30 seconds."

      - alert: EscrowPlatformHighHttpErrorRate
        expr: |
          (
            sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            clamp_min(sum by (application) (rate(http_server_requests_seconds_count[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate for {{ $labels.application }}"
          description: "More than 5% of HTTP requests have returned 5xx responses for five minutes."

  - name: escrow-platform-funding
    rules:
      - alert: EscrowOutboxEventFailed
        expr: escrow_outbox_events{status="failed"} > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Failed outbox events in {{ $labels.application }}"
          description: "At least one outbox event requires investigation or controlled replay."

      - alert: EscrowOutboxBacklogStale
        expr: escrow_outbox_oldest_pending_age_seconds > 120
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Stale outbox backlog in {{ $labels.application }}"
          description: "The oldest pending outbox event has been waiting for more than two minutes."

      - alert: EscrowKafkaConsumerLagHigh
        expr: kafka_consumer_fetch_manager_records_lag_max > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high in {{ $labels.application }}"
          description: "A Kafka consumer has remained more than 100 records behind for five minutes."

      - alert: EscrowLedgerImbalance
        expr: escrow_ledger_imbalanced_journals > 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "A persisted ledger journal is imbalanced"
          description: "Debit and credit totals differ. Treat this as a critical financial incident."
