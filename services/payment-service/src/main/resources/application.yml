spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:5434}/${PAYMENT_DB_NAME:payment_db}
    username: ${PAYMENT_DB_USER:payment_local}
    password: ${PAYMENT_DB_PASSWORD:payment_local_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

escrow-service:
  base-url: ${ESCROW_SERVICE_BASE_URL:http://localhost:8082}
  connect-timeout: ${ESCROW_SERVICE_CONNECT_TIMEOUT:1s}
  read-timeout: ${ESCROW_SERVICE_READ_TIMEOUT:2s}

payment-provider:
  simulated:
    callback-secret: ${SIMULATED_PROVIDER_CALLBACK_SECRET:local-development-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
