spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:5434}/${PAYMENT_DB_NAME:payment_db}
    username: ${PAYMENT_DB_USER:payment_local}
    password: ${PAYMENT_DB_PASSWORD:payment_local_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

payment:
  messaging:
    topics:
      events: ${PAYMENT_EVENTS_TOPIC:payment.events.v1}
  outbox:
    publisher:
      enabled: ${PAYMENT_OUTBOX_PUBLISHER_ENABLED:true}
      poll-interval: ${PAYMENT_OUTBOX_POLL_INTERVAL:500ms}
      batch-size: ${PAYMENT_OUTBOX_BATCH_SIZE:100}
      publish-timeout: ${PAYMENT_OUTBOX_PUBLISH_TIMEOUT:5s}
      initial-retry-delay: ${PAYMENT_OUTBOX_INITIAL_RETRY_DELAY:1s}
      max-retry-delay: ${PAYMENT_OUTBOX_MAX_RETRY_DELAY:5m}

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

escrow-service:
  base-url: ${ESCROW_SERVICE_BASE_URL:http://localhost:8082}
  connect-timeout: ${ESCROW_SERVICE_CONNECT_TIMEOUT:1s}
  read-timeout: ${ESCROW_SERVICE_READ_TIMEOUT:2s}

payment-provider:
  simulated:
    callback-secret: ${SIMULATED_PROVIDER_CALLBACK_SECRET:local-development-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
