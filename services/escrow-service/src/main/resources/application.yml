spring:
  application:
    name: escrow-service
  datasource:
    url: jdbc:postgresql://${ESCROW_DB_HOST:localhost}:${ESCROW_DB_PORT:5433}/${ESCROW_DB_NAME:escrow_db}
    username: ${ESCROW_DB_USER:escrow_local}
    password: ${ESCROW_DB_PASSWORD:escrow_local_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${ESCROW_LEDGER_CONSUMER_GROUP:escrow-funding-secured-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: ${ESCROW_LEDGER_CONSUMER_CONCURRENCY:3}

escrow:
  messaging:
    consumer-enabled: ${ESCROW_MESSAGING_CONSUMER_ENABLED:true}
    topics:
      ledger-events: ${LEDGER_EVENTS_TOPIC:ledger.events.v1}

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
